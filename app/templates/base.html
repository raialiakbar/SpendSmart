<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SpendSmart{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <header>
    <div class="container nav">
      <a href="{{ url_for('main.index') }}" class="logo">SpendSmart</a>
      <nav class="nav-links">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main.transactions') }}">Transactions</a>
        <form method="POST" action="{{ url_for('auth.logout') }}">
          <button type="submit" class="logout-button">Logout</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">
      {{ message }}
    </div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">SpendSmart &middot; Personal spending tracker</div>
  </footer>
</body>

</html>
