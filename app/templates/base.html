<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SpendSmart{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="container nav">
      <a href="{{ url_for('main.index') }}" class="logo">SpendSmart</a>
      <nav class="nav-links">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.login') }}">Login</a>
        <a href="{{ url_for('main.register') }}">Register</a>
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main.transactions') }}">Transactions</a>
        <a href="{{ url_for('main.logout') }}">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">SpendSmart &middot; Personal spending tracker</div>
  </footer>
</body>
</html>
